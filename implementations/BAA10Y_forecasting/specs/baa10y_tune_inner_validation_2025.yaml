# Inner-validation backtest for adaptive parameter tuning.
#
# Every Optuna parameter configuration is evaluated on this period
# after its development-period evaluation. Optuna minimizes the mean
# CRPS from this inner-validation window.
#
# This is not the final outer-validation period. The separate
# baa10y_validate_2025.yaml file must remain unavailable until
# parameter tuning has stopped and the winning configuration is frozen.
#
# All forecast origins begin on Wednesday and use stride 5 to reduce
# problems caused by Monday market holidays and unavailable covariates.

spec_id: baa10y_tune_inner_validation_2025

description: >-
  Later 2025 inner-validation backtest for BAA10Y adaptive parameter
  tuning. Mean CRPS from this period is the Optuna objective. The
  adaptive agent compares it with development-period CRPS to identify
  possible model overfitting.

tasks:
  - task_id: baa10y_change_1b
    target_series_id: baa10y_change_1b
    horizons: [1]
    frequency: B
    description: >-
      BAA10Y close-to-close cumulative change, 1 business day ahead.
      This task evaluates next-session spread-change forecasts.

  - task_id: baa10y_change_5b
    target_series_id: baa10y_change_5b
    horizons: [5]
    frequency: B
    description: >-
      BAA10Y close-to-close cumulative change, 5 business days ahead.
      This task evaluates forward one-week spread-change forecasts.

  - task_id: baa10y_change_21b
    target_series_id: baa10y_change_21b
    horizons: [21]
    frequency: B
    description: >-
      BAA10Y close-to-close cumulative change, 21 business days ahead.
      This task evaluates forward one-month spread-change forecasts.

start: "2025-05-07"
end: "2025-08-06"

# One forecast origin approximately every week.
stride: 5

# Minimum historical observations available before each forecast origin.
warmup: 250