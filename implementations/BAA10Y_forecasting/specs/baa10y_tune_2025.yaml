spec_id: baa10y_tune_2025

description: >-
  Adaptive parameter-search period covering weekly forecast origins
  during the first half of 2025.

tasks:
  - task_id: baa10y_change_1b
    target_series_id: baa10y_change_1b
    horizons: [1]
    frequency: B
    description: >-
      BAA10Y cumulative spread change one business day ahead.

  - task_id: baa10y_change_5b
    target_series_id: baa10y_change_5b
    horizons: [5]
    frequency: B
    description: >-
      BAA10Y cumulative spread change five business days ahead.

  - task_id: baa10y_change_21b
    target_series_id: baa10y_change_21b
    horizons: [21]
    frequency: B
    description: >-
      BAA10Y cumulative spread change twenty-one business days ahead.

