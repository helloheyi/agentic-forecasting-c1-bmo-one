# Development-period backtest for adaptive parameter tuning.
#
# Every Optuna parameter configuration is first evaluated on this
# earlier development window. This result is diagnostic: Optuna does
# not minimize development CRPS directly.
#
# All forecast origins begin on Wednesday and use stride 5 to reduce
# problems caused by Monday market holidays and unavailable covariates.

spec_id: baa10y_tune_development_2025

description: >-
  Earlier 2025 development-period backtest for BAA10Y adaptive
  parameter tuning. The resulting CRPS is compared with the later
  inner-validation CRPS to identify possible model overfitting.

tasks:
  - task_id: baa10y_change_1b
    target_series_id: baa10y_change_1b
    horizons: [1]
    frequency: B
    description: >-
      BAA10Y close-to-close cumulative change, 1 business day ahead.
      This task evaluates next-session spread-change forecasts.

  - task_id: baa10y_change_5b
    target_series_id: baa10y_change_5b
    horizons: [5]
    frequency: B
    description: >-
      BAA10Y close-to-close cumulative change, 5 business days ahead.
      This task evaluates forward one-week spread-change forecasts.

  - task_id: baa10y_change_21b
    target_series_id: baa10y_change_21b
    horizons: [21]
    frequency: B
    description: >-
      BAA10Y close-to-close cumulative change, 21 business days ahead.
      This task evaluates forward one-month spread-change forecasts.

start: "2025-01-08"
end: "2025-04-30"

# One forecast origin approximately every week.
stride: 5

# Minimum historical observations available before each forecast origin.
warmup: 250